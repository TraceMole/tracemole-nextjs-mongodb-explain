# On main: opens/updates a "Version packages" PR from pending changesets.
# When that PR is merged (no changesets left), publishes every package whose
# version is not on npm yet. Needs the NPM_TOKEN repo secret (npm automation token).
name: Release

# Manual only for now: releases are published from a maintainer's machine.
# To automate later, add `push: branches: [main]` back and the NPM_TOKEN secret.
on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check-types && npm test
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
